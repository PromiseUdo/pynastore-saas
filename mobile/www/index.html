<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>MansaaS</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: max(24px, env(safe-area-inset-top)) 24px
          max(24px, env(safe-area-inset-bottom));
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        background: #ffffff;
        color: #0b0b0c;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0b0b0c; color: #f5f5f5; }
      }
      h1 { font-size: 1.125rem; font-weight: 600; margin: 0; }
      p { font-size: 0.9rem; opacity: 0.7; margin: 0; max-width: 24rem; }
      button {
        margin-top: 8px;
        padding: 10px 20px;
        border: 0;
        border-radius: 10px;
        font-size: 0.9rem;
        font-weight: 600;
        background: #0b0b0c;
        color: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        button { background: #f5f5f5; color: #0b0b0c; }
      }
    </style>
  </head>
  <body>
    <h1>You're offline</h1>
    <p>We can't reach the store right now. Check your connection and try again.</p>
    <button onclick="window.location.reload()">Retry</button>
  </body>
</html>
